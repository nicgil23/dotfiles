general {
    lock_cmd = qs -p /home/hypr/dotfiles/modified_repos/nandoroid-shell ipc call lock activate
    before_sleep_cmd = qs -p /home/hypr/dotfiles/modified_repos/nandoroid-shell ipc call lock abortFingerPam && loginctl lock-session && sleep 1
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Atenuar pantalla (5 min)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10         
    on-resume = brightnessctl -r                 
}

# 2. Bloquear sesión (5.5 min)
listener {
    timeout = 330                                 
    on-timeout = loginctl lock-session            
}

# 3. Apagar monitor (6 min)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspensión total (10 min) (comentar para que nunca se suspenda)
listener {
    timeout = 600                                
    on-timeout = systemctl suspend                
}
